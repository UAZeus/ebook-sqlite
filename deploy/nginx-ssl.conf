server {
    listen 443 ssl http2;
    server_name _;
    root /usr/share/nginx/html;
    index index.php;

    # ─── SSL (replace with your cert paths) ────────────────────
    ssl_certificate     /etc/letsencrypt/live/your-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ─── Catch-all: transparently prefix with /ebook ──────────
    location / {
        rewrite ^/((?!ebook(?:/|$)).*)$ /ebook/$1 last;
    }

    # ─── Main app block ──────────────────────────────────────
    location /ebook {
        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; script-src 'self' 'unsafe-inline';";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Block sensitive paths
        location ~ ^/ebook/(partials|config|database|vendor) {
            return 404;
        }

        # API routing
        location /ebook/api/ {
            try_files $uri /ebook/api/index.php?$query_string;
        }

        # Clean URL routes
        location /ebook/ {
            try_files $uri $uri/ @ebook_routes;
        }
        location @ebook_routes {
            rewrite ^/ebook/(login|register|account|activity|admin|preferences|upload|logout)$ /ebook/$1.php last;
            rewrite ^/ebook/book/(\d+)$ /ebook/book.php?id=$1 last;
            rewrite ^/ebook/$ /ebook/index.php last;
        }

        # PHP-FPM
        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # ─── Static assets ────────────────────────────────────────
    location /ebook/public/ { }
    location /ebook/uploads/ { }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
