server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.php;

    # ─── Catch-all: transparently prefix with /ebook ──────────
    # Rewrite /anything → /ebook/anything so the app works at /ebook
    # without changing any PHP/JS code.
    location / {
        rewrite ^/((?!ebook(?:/|$)).*)$ /ebook/$1 last;
    }

    # ─── Main app block ──────────────────────────────────────
    location /ebook {
        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; script-src 'self' 'unsafe-inline';";
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        # Block sensitive paths
        location ~ ^/ebook/(partials|config|database|vendor) {
            return 404;
        }

        # API routing
        location /ebook/api/ {
            try_files $uri /ebook/api/index.php?$query_string;
        }

        # Clean URL routes
        location /ebook/ {
            try_files $uri $uri/ @ebook_routes;
        }
        location @ebook_routes {
            rewrite ^/ebook/(login|register|account|activity|admin|preferences|upload|logout)$ /ebook/$1.php last;
            rewrite ^/ebook/book/(\d+)$ /ebook/book.php?id=$1 last;
            rewrite ^/ebook/$ /ebook/index.php last;
        }

        # PHP-FPM
        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # ─── Static assets (no PHP processing needed) ────────────
    location /ebook/public/ { }
    location /ebook/uploads/ { }
}
